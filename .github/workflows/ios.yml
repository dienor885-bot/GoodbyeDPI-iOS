name: Build IPA

on:
  workflow_dispatch:
  push:

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned (no Apple team required)
        run: |
          xcodebuild \
            -project GoodbyeDPI.xcodeproj \
            -scheme GoodbyeDPI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Pack IPA
        run: |
          APP=$(find build -name "GoodbyeDPI.app" -type d | head -1)
          test -n "$APP"
          APPEX=$(find "$APP" -name "*.appex" -type d | head -1)
          test -d "$APPEX"
          chmod +x "$APP/GoodbyeDPI" "$APPEX/GoodbyeDPITunnel" || true
          printf 'APPL????' > "$APP/PkgInfo"
          printf 'XPC!!!!!' > "$APPEX/PkgInfo"
          rm -rf "$APP/_CodeSignature" "$APPEX/_CodeSignature"
          rm -rf Payload
          mkdir Payload
          ditto "$APP" Payload/GoodbyeDPI.app
          python3 scripts/repack-ipa.py GoodbyeDPI-unsigned-tmp.ipa GoodbyeDPI-unsigned.ipa || python3 -c "
          import os, zipfile
          out='GoodbyeDPI-unsigned.ipa'
          if os.path.exists(out): os.remove(out)
          with zipfile.ZipFile(out,'w',allowZip64=False) as z:
              for root, dirs, files in os.walk('Payload'):
                  for fn in files:
                      path=os.path.join(root,fn)
                      arc=path.replace(chr(92),'/')
                      z.write(path, arc, zipfile.ZIP_STORED if fn=='PkgInfo' else zipfile.ZIP_DEFLATED)
          print('packed', os.path.getsize(out))
          "
          unzip -l GoodbyeDPI-unsigned.ipa | grep -E 'PkgInfo|appex|Info.plist'

      - uses: actions/upload-artifact@v4
        with:
          name: GoodbyeDPI-unsigned
          path: GoodbyeDPI-unsigned.ipa
