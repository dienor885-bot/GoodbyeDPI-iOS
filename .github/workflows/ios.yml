name: Build IPA

on:
  workflow_dispatch:
  push:

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build unsigned (no Apple team required)
        run: |
          xcodebuild \
            -project GoodbyeDPI.xcodeproj \
            -scheme GoodbyeDPI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build

      - name: Pack IPA
        run: |
          APP=$(find build -name "GoodbyeDPI.app" -type d | head -1)
          test -n "$APP"
          APPEX=$(find "$APP" -name "*.appex" -type d | head -1)
          echo "APP=$APP APPEX=$APPEX"
          test -d "$APPEX"
          plutil -p "$APPEX/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :NSExtension' "$APPEX/Info.plist"
          chmod +x "$APP/GoodbyeDPI" "$APPEX/GoodbyeDPITunnel" || true
          printf 'APPL????' > "$APP/PkgInfo"
          printf 'XPC!!!!!' > "$APPEX/PkgInfo"
          rm -rf "$APP/_CodeSignature" "$APPEX/_CodeSignature"
          rm -rf Payload
          mkdir Payload
          ditto "$APP" Payload/GoodbyeDPI.app
          ditto -c -k --sequesterRsrc --keepParent Payload GoodbyeDPI-unsigned.ipa
          ls -lh GoodbyeDPI-unsigned.ipa
          unzip -l GoodbyeDPI-unsigned.ipa | grep -E 'appex|Info.plist'

      - uses: actions/upload-artifact@v4
        with:
          name: GoodbyeDPI-unsigned
          path: GoodbyeDPI-unsigned.ipa
